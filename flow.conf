# flow.conf — single source of configuration for the analog flow.
#
# Syntax is deliberately restricted to `KEY ?= value` (one per line, no inline
# comments) so the SAME file is read by GNU Make (include) and by bash
# (flow/lib/env.sh). Precedence everywhere: make command line > environment > this file.

# --- PDK ---------------------------------------------------------------------
PDK ?= sky130A
PDK_ROOT ?= /foss/pdks

# --- Container used for local `flow/docker.sh` runs and CI. -------------------
# Pin a tag you have validated; `latest` drifts and makes results irreproducible.
FLOW_IMAGE ?= hpretl/iic-osic-tools:2026.09

# --- Engines -------------------------------------------------------------------
# klayout = KLayout LVS deck from the PDK
# netgen  = magic extraction + netgen compare (mature path for sky130)
LVS_ENGINE ?= klayout
# c  = parasitic capacitance only (fast, small netlist)
# rc = resistance + capacitance via magic extresist (slower, accurate wiring R)
PEX_MODE ?= rc
# magic extresist tolerance; larger value = fewer, coarser resistors
PEX_RES_TOLERANCE ?= 10

# --- Gating --------------------------------------------------------------------
# 1 = PEX starts only after LVS is clean (PEX of a wrong layout is meaningless)
# 0 = PEX runs concurrently with LVS (faster feedback, results unsigned until LVS passes)
STRICT_GATE ?= 1
# 1 = post-layout simulation: testbench re-run with the DUT replaced by its PEX netlist
POSTSIM ?= 1

# --- PEX <-> schematic port reconciliation ---------------------------------------
# Space-separated FROM:TO pairs that merge PEX-only nets into schematic ports.
# Typical for magic's implicit substrate node, e.g.:  PEX_PORT_ALIAS ?= VSUBS:VSS
PEX_PORT_ALIAS ?=

# --- Per-stage time limits (seconds) ---------------------------------------------
NETLIST_TIMEOUT ?= 300
SIM_TIMEOUT ?= 1800
DRC_TIMEOUT ?= 3600
LVS_TIMEOUT ?= 3600
PEX_TIMEOUT ?= 3600

# --- KLayout library name for this project (empty = folder name, '-' -> '_') ----
KLAYOUT_LIB ?= ELAD1

# --- Optional explicit deck overrides (empty = auto-detect inside the PDK) -------
KLAYOUT_DRC_DECK ?=
KLAYOUT_LVS_DECK ?=

# --- Tiny Tapeout (used by make tt-*; see flow/tt/) --------------------------------
# tt-support-tools commit whose precheck 'make tt-precheck' runs (TT's GitHub Action uses 'main').
TT_TOOLS_REF ?= 01d5d2814fa9dd61e9d211e0b235a4a592a9316a
# 1 = tt-check fails while any uo_out/uio_out/uio_oe pin is unconnected (TT analog spec rule)
TT_REQUIRE_TIEOFF ?= 1
# Width (um) of the VGND/VDPWR(/VAPWR) met4 stripes drawn by make tt-init (TT minimum: 1.2)
TT_STRIPE_W ?= 2
# 1 = make tt-init ties all 24 digital outputs to VGND (delete a stub to drive that output)
TT_TIEOFF ?= 1
